name: Release ResourcePack

on:
  push:
    tags:
      - 'v*'          # релиз через тег
  pull_request:
    types:
      - closed        # релиз через merge PR
    branches:
      - main

jobs:
  release:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------
      # Определяем версию
      # ------------------------
      - name: Determine version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"   # push tag v1.0.0 → 1.0.0
          else
            VERSION="${GITHUB_HEAD_REF#v}"   # PR branch v1.0.0 → 1.0.0
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version $VERSION"

      # ------------------------
      # Читаем pack_game_version из pack.mcmeta
      # ------------------------
      - name: Extract pack_game_version
        run: |
          PACK_GAME_VERSION=$(jq -r '.gtnh_resource_pack_updater.pack_game_version' pack.mcmeta)
          echo "PACK_GAME_VERSION=$PACK_GAME_VERSION" >> $GITHUB_ENV
          echo "Detected pack_game_version: $PACK_GAME_VERSION"

      # ------------------------
      # Создаём zip
      # ------------------------
      - name: Create zip archive
        run: |
          ZIP_NAME="GTNH-FTI-Faithful-${VERSION}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          zip -r "$ZIP_NAME" assets pack.mcmeta pack.png

      # ------------------------
      # Генерируем gtnh-pack-update.json (для релиза)
      # ------------------------
      - name: Generate release JSON
        run: |
          cat <<EOF > gtnh-pack-update.json
          {
            "schema": 1,
            "pack_game_version": "${PACK_GAME_VERSION}",
            "pack_version": "${VERSION}"
          }
          EOF

          cat gtnh-pack-update.json

      # ------------------------
      # Извлекаем changelog
      # ------------------------
      - name: Extract changelog
        run: |
          awk "/## Version: $VERSION/{flag=1;next}/## Version: /{flag=0}flag" CHANGELOG.md > RELEASE.md
          cat RELEASE.md

      # ------------------------
      # Создаём GitHub Release
      # ------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          body_path: RELEASE.md
          files: ${{ env.ZIP_NAME }}
