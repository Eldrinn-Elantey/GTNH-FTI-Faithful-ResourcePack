name: Release notes preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release notes to job summary
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "$PR_TITLE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "## Version: ${PR_TITLE#v}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR title '$PR_TITLE' is not a version, merging will not create a release." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/release-notes.sh >> "$GITHUB_STEP_SUMMARY"
